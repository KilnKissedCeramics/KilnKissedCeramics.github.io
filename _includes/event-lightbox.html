<div
  aria-labelledby="event-lightbox-title"
  aria-modal="true"
  class="event-lightbox"
  data-event-lightbox
  hidden
  role="dialog"
>
  <div class="event-lightbox-backdrop" data-event-lightbox-backdrop></div>
  <div class="event-lightbox-panel" data-event-lightbox-panel>
    <button
      aria-label="Close event details"
      class="event-lightbox-close"
      data-event-lightbox-close
      type="button"
    >
      ×
    </button>
    <div class="event-lightbox-content">
      <div class="event-lightbox-image">
        <img alt="" data-event-lightbox-image src="" />
      </div>
      <div class="event-lightbox-details">
        <span
          class="event-status-label"
          data-event-lightbox-status
          hidden
        ></span>
        <h2
          class="event-lightbox-title"
          data-event-lightbox-title
          id="event-lightbox-title"
        ></h2>
        <div class="event-lightbox-description">
          <p data-event-lightbox-date></p>
          <p data-event-lightbox-time></p>
          <p data-event-lightbox-venue></p>
          <p data-event-lightbox-address></p>
          <div data-event-lightbox-description></div>
        </div>
        <p>
          <a
            class="event-lightbox-link"
            data-event-lightbox-external
            href="#"
            rel="noopener"
            target="_blank"
            >Event website</a
          >
        </p>
      </div>
    </div>
    <div class="event-lightbox-nav" aria-label="Event details navigation">
      <button data-event-lightbox-prev type="button">← Previous</button>
      <button data-event-lightbox-next type="button">Next →</button>
    </div>
  </div>
</div>

<script id="event-lightbox-data" type="application/json">
  [
    {% assign wrote_event = false %}
    {% for event in include.events %}
      {% assign buffer_days = event.status_buffer_days | default: 2 %}
      {% assign buffer_seconds = buffer_days | times: 86400 %}
      {% assign event_end_seconds = event.end_date | date: "%s" | plus: 0 %}
      {% assign active_until_seconds = event_end_seconds | plus: buffer_seconds %}
      {% if active_until_seconds >= include.now_seconds %}
        {% assign event_status = "active" %}
      {% else %}
        {% assign event_status = "past" %}
      {% endif %}
      {% assign include_event = true %}
      {% if include.active_only and event_status == "past" %}
        {% assign include_event = false %}
      {% endif %}
      {% if include_event %}
        {% if wrote_event %},{% endif %}
        {
          "title": {{ event.title | jsonify }},
          "slug": {{ event.slug | jsonify }},
          "start_date": {{ event.start_date | date: "%Y-%m-%d" | jsonify }},
          "end_date": {{ event.end_date | date: "%Y-%m-%d" | jsonify }},
          "display_date": {{ event.display_date | jsonify }},
          "time": {{ event.time | jsonify }},
          "venue": {{ event.venue | jsonify }},
          "address": {{ event.address | jsonify }},
          "external_url": {{ event.external_url | jsonify }},
          "external_label": {{ event.external_label | jsonify }},
          "image": {{ event.image | relative_url | jsonify }},
          "image_alt": {{ event.image_alt | jsonify }},
          "description": {{ event.content | markdownify | strip_newlines | jsonify }},
          "status": {{ event_status | jsonify }}
        }
        {% assign wrote_event = true %}
      {% endif %}
    {% endfor %}
  ]
</script>
